<!doctype html>
<!--
  Preview of anova-oven-card with fake oven data, outside Home Assistant.
  Open this file in a browser. It loads the real card code next to it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anova Oven Card Preview</title>
  <style>
    :root {
      --primary-text-color: #1c1f23; --secondary-text-color: #69737a;
      --card-background-color: #ffffff; --secondary-background-color: #eef1f3;
      --divider-color: #dde2e5; --error-color: #db4437; --page: #f3f5f6;
      --rgb-primary-text-color: 28, 31, 35; --rgb-error-color: 219, 68, 55; --rgb-warning-color: 255, 166, 0;
      --rgb-amber-color: 255, 193, 7; --rgb-disabled-color: 158, 158, 158; --warning-color: #e69500;
    }
    :root[data-theme="dark"] {
      --primary-text-color: #e6e9eb; --secondary-text-color: #9aa5ac;
      --card-background-color: #1d2226; --secondary-background-color: #2a3035;
      --divider-color: #384047; --error-color: #ef5350; --page: #111417;
      --rgb-primary-text-color: 230, 233, 235; --rgb-error-color: 239, 83, 80;
    }
    body { margin: 0; background: var(--page); font-family: Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--primary-text-color); }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px; align-items: center; }
    .bar button { border: 1px solid var(--divider-color); background: var(--card-background-color); color: var(--primary-text-color);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .bar button.on { border-color: #F26B1D; color: #F26B1D; }
    .bar .sep { width: 1px; height: 24px; background: var(--divider-color); margin: 0 6px; }
    .stage { display: flex; flex-wrap: wrap; gap: 24px; padding: 8px 16px 24px; align-items: flex-start; }
    .frame { width: 420px; max-width: 100%; }
    .frame.phone { width: 360px; }
    .frame h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--secondary-text-color); margin: 0 0 8px; }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; border: 1px solid var(--divider-color);
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04); }
    ha-icon { display: inline-flex; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px);
      align-items: center; justify-content: center; font-size: calc(var(--mdc-icon-size, 24px) * .8); line-height: 1; }
    #log { margin: 0 16px 24px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--secondary-text-color); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="bar" id="scenarios"></div>
  <div class="stage">
    <div class="frame"><h3>Dashboard</h3><anova-oven-card id="a"></anova-oven-card></div>
    <div class="frame phone"><h3>Phone width</h3><anova-oven-card id="b"></anova-oven-card></div>
  </div>
  <div id="log">Service calls appear here.</div>

  <script>
    // A stand-in for HA's <ha-icon>: a few emoji instead of the MDI font.
    const ICONS = {
      "mdi:stove": "♨︎", "mdi:lightbulb-on": "💡", "mdi:lightbulb-outline": "○", "mdi:water-percent": "💧",
      "mdi:thermometer-probe": "🌡", "mdi:door-open": "🚪", "mdi:door-closed": "▯", "mdi:skip-next": "⏭",
      "mdi:stop": "■", "mdi:timer-outline": "⏱", "mdi:wifi-off": "📵", "mdi:water-off": "🚱",
      "mdi:water-alert": "⚠", "mdi:pizza": "🍕", "mdi:bread-slice": "🍞", "mdi:food-steak": "🥩",
      "mdi:fish": "🐟", "mdi:chef-hat": "👨‍🍳", "mdi:toaster-oven": "▭",
    };
    customElements.define("ha-icon", class extends HTMLElement {
      static get observedAttributes() { return ["icon"]; }
      connectedCallback() { this.render(); }
      attributeChangedCallback() { this.render(); }
      render() { this.textContent = ICONS[this.getAttribute("icon")] || "•"; }
    });
  </script>
  <script src="anova-oven-card.js"></script>
  <script>
    const P = "anova_oven";
    const in_ = (s) => new Date(Date.now() + s * 1000).toISOString();
    const base = {
      connected: "on", cooking: "off", mode: "Idle", temperature: "23", target_temperature: "unknown",
      probe_temperature: "unknown", steam: "41", stage_ends_at: "unknown", stage: "unknown",
      stage_description: "unknown", current_recipe: "unknown", next_stage_ready: "off",
      door: "off", lamp: "off", water_tank_empty: "off", descale_required: "off", set_timer: "unknown", cook: "cook_started",
    };
    const SCENARIOS = {
      "Idle": {},
      "Preheating": { cooking: "on", mode: "Preheating", temperature: "142", target_temperature: "220",
        current_recipe: "Pizza", stage: "1 of 3", stage_description: "Preheat · 220 °C", lamp: "on", steam: "18" },
      "Cooking": { cooking: "on", mode: "Cooking", temperature: "219", target_temperature: "220",
        current_recipe: "Pizza", stage: "2 of 3", stage_description: "Bake · 220 °C · steam 30%",
        stage_ends_at: in_(9 * 60 + 41), set_timer: "15", lamp: "on", steam: "30" },
      "Sous vide + probe": { cooking: "on", mode: "Cooking", temperature: "57", target_temperature: "58",
        probe_temperature: "51", current_recipe: "Salmon", stage: "1 of 1", stage_description: "Sous vide · 58 °C wet bulb",
        stage_ends_at: in_(42 * 60), set_timer: "60", steam: "100" },
      "Next stage ready": { cooking: "on", mode: "Cooking", temperature: "180", target_temperature: "180",
        current_recipe: "Bread", stage: "1 of 2", stage_description: "Steam bake · 180 °C", next_stage_ready: "on" },
      "Door open": { cooking: "on", mode: "Cooking", temperature: "171", target_temperature: "200", door: "on",
        current_recipe: "Toast", stage: "1 of 1", stage_description: "Toast · 200 °C", stage_ends_at: in_(150), set_timer: "8" },
      "Done (still heating)": { cooking: "on", mode: "Cooking", temperature: "200", target_temperature: "200",
        current_recipe: "Toast", stage: "1 of 1", stage_description: "Toast · 200 °C", cook: "cook_done" },
      "Water + descale": { water_tank_empty: "on", descale_required: "on" },
      "Offline": { connected: "off", temperature: "unknown", steam: "unknown" },
    };
    const recipes = ["Pizza", "Bread", "Toast", "Reheat", "Salmon"];
    const presets = [
      { name: "Pizza", recipe: "Pizza", icon: "mdi:pizza" },
      { name: "Bread", recipe: "Bread", icon: "mdi:bread-slice" },
      { name: "Toast", recipe: "Toast", icon: "mdi:bread-slice" },
      { name: "Reheat", recipe: "Reheat", icon: "mdi:food-steak" },
      { name: "Salmon", recipe: "Salmon", icon: "mdi:fish" },
    ];
    const DOMAIN = { connected: "binary_sensor", cooking: "binary_sensor", next_stage_ready: "binary_sensor",
      door: "binary_sensor", water_tank_empty: "binary_sensor", descale_required: "binary_sensor", lamp: "light",
      set_timer: "number" };

    let current = "Cooking";
    const cards = [document.getElementById("a"), document.getElementById("b")];
    cards[0].setConfig({ type: "custom:anova-oven-card", title: "Oven", presets });
    cards[1].setConfig({ type: "custom:anova-oven-card", title: "Oven" });

    function hass() {
      const values = { ...base, ...SCENARIOS[current] };
      const states = {};
      for (const [k, v] of Object.entries(values)) {
        if (k === "cook") continue;
        states[`${DOMAIN[k] || "sensor"}.${P}_${k}`] = { state: v, attributes: {} };
      }
      states[`event.${P}_cook`] = { state: new Date().toISOString(), attributes: { event_type: values.cook } };
      states[`select.${P}_recipe`] = { state: "Pizza", attributes: { options: recipes } };
      return {
        states,
        callService(domain, service, data) {
          const log = document.getElementById("log");
          log.textContent = `${new Date().toLocaleTimeString()}  ${domain}.${service} ${JSON.stringify(data)}\n` + log.textContent;
          if (domain === "light") { base.lamp = base.lamp === "on" ? "off" : "on"; SCENARIOS[current].lamp && delete SCENARIOS[current].lamp; update(); }
          return Promise.resolve();
        },
      };
    }
    function update() { const h = hass(); cards.forEach((c) => { c.hass = h; }); renderBar(); }

    function renderBar() {
      const bar = document.getElementById("scenarios");
      bar.innerHTML = "";
      for (const name of Object.keys(SCENARIOS)) {
        const b = document.createElement("button");
        b.textContent = name;
        b.className = name === current ? "on" : "";
        b.onclick = () => { current = name; update(); };
        bar.appendChild(b);
      }
      const sep = document.createElement("span"); sep.className = "sep"; bar.appendChild(sep);
      const t = document.createElement("button");
      const dark = document.documentElement.dataset.theme === "dark";
      t.textContent = dark ? "Light theme" : "Dark theme";
      t.onclick = () => { document.documentElement.dataset.theme = dark ? "light" : "dark"; renderBar(); };
      bar.appendChild(t);
    }
    update();
  </script>
</body>
</html>
